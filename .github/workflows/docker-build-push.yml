name: Build and push Docker image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install deps and run checks
        run: |
          npm ci
          npm run check -- --output human
          npm test
          npm run build

      - name: Browser regressions
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Normalize registry owner (lowercase)
        run: echo "REGISTRY_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build image for runtime verification
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: |
            ghcr.io/${{ env.REGISTRY_OWNER }}/kb-suite-app:${{ github.sha }}
            ghcr.io/${{ env.REGISTRY_OWNER }}/kb-suite-app:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify container startup and workout storage
        env:
          IMAGE: ghcr.io/${{ env.REGISTRY_OWNER }}/kb-suite-app:${{ github.sha }}
        run: |
          docker run --detach --name kb-suite-smoke --publish 127.0.0.1:4180:4173 "$IMAGE"
          node scripts/smoke-container.mjs http://127.0.0.1:4180

      - name: Publish verified image
        env:
          IMAGE: ghcr.io/${{ env.REGISTRY_OWNER }}/kb-suite-app
          REVISION: ${{ github.sha }}
        run: |
          docker push "$IMAGE:$REVISION"
          docker push "$IMAGE:latest"

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs kb-suite-smoke 2>&1 || true
          docker rm --force kb-suite-smoke || true
